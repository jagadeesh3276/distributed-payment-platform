global:
  scrape_interval: 15s
scrape_configs:
  - job_name: api-1
    metrics_path: /metrics
    static_configs: [{targets: ["api-1:8000"]}]
  - job_name: api-2
    metrics_path: /metrics
    static_configs: [{targets: ["api-2:8000"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
