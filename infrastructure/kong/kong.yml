_format_version: "3.0"
_transform: true
services:
  - name: transaction-service
    host: transaction-upstream
    port: 8000
    protocol: http
    routes:
      - name: transaction-api
        paths: ["/"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 600
          policy: local
upstreams:
  - name: transaction-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy: {interval: 5, successes: 2}
        unhealthy: {interval: 5, tcp_failures: 2, timeouts: 2, http_failures: 3}
    targets:
      - target: api-1:8000
        weight: 100
      - target: api-2:8000
        weight: 100
